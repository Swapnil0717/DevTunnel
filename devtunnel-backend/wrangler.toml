FRONTEND_URL = "https://staging.devtunnel.tech"
ALLOWED_ORIGINS = "https://staging.devtunnel.tech"
COOKIE_DOMAIN = "devtunnel.tech"
SUPABASE_URL = "https://bdxnvouuyfjryuncxkfx.supabase.co"
SUPABASE_DB_SCHEMA = "devtunnel"
GITHUB_CLIENT_ID = "Ov23ligxea5bIh7uUl8V" # same GitHub App as production for now; split later if needed
SESSION_TTL_DAYS = "30"
GROQ_MODEL = "openai/gpt-oss-120b"
AI_FEATURES_ENABLED = "true"
GROQ_SEARCH_MODEL = "llama-3.1-8b-instant"
GROQ_SECONDARY_MODEL = "openai/gpt-oss-20b"
CEREBRAS_MODEL = ""
GEMINI_MODEL = "gemini-3.5-flash-lite"
MISTRAL_MODEL = ""
OPENROUTER_MODEL = "openai/gpt-oss-20b:free"
GITHUB_MODELS_MODEL = ""
CF_AI_MODEL = "@cf/openai/gpt-oss-20b"
# KV-migration flags (see the production [vars] block for what each does).
USE_SUPABASE_CACHE = "true"
USE_SUPABASE_LOCKS = "true"
USE_SUPABASE_CLI_CODES = "true"
USE_RATE_LIMIT_BINDING = "true"
KV_READ_FALLBACK = "true"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"

# Rate Limiting bindings are NOT inherited by [env.staging], so they are
# declared again, with their own namespace ids so staging traffic never
