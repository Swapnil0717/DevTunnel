name = "devtunnel-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# KV namespace used for fixed-window rate limiting on sensitive auth routes
# (Backend_Development_Rules.txt rule 43). Create it once with:
#
#   npx wrangler kv namespace create RATE_LIMIT_KV
#   npx wrangler kv namespace create RATE_LIMIT_KV --preview
#
# then paste the returned ids below.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4e64447403314490b7a19642fd54d2ac"
preview_id = "e51efed129714857aa3ca01040f56314"

# ---------------------------------------------------------------------------
# Non-secret configuration. Safe to commit — none of these values are
# credentials (Backend_Development_Rules.txt rule 7). Secrets (GitHub client
# secret, Supabase service role key, session signing key) are NEVER put here
# — see README.md "Secrets" section for `wrangler secret put` commands.
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"

# Public URL of this backend once deployed (must match the GitHub OAuth
# App's "Authorization callback URL" exactly, including path).
GITHUB_CALLBACK_URL = "https://api.devtunnel.tech/auth/callback"

# Second callback URL for the SAME GitHub App, used only by the `dev
# login` CLI loopback flow (src/routes/authCli.ts). Must ALSO be added to
# the GitHub App's "Callback URL" list (Settings > Developer settings >
# GitHub Apps > DevTunnel.tech) alongside GITHUB_CALLBACK_URL above — a
# GitHub App supports multiple callback URLs, unlike a classic OAuth App.
GITHUB_CLI_CALLBACK_URL = "https://api.devtunnel.tech/auth/cli/callback"

# Canonical URL of the Next.js frontend (devtunnel-frontend). Used to build
# the post-login/post-error redirect target and as the default CORS origin.
FRONTEND_URL = "https://devtunnel.tech"

# Comma-separated allowlist of origins permitted to call this API with
# credentials (Backend_Development_Rules.txt rules 45–46). No wildcards.
ALLOWED_ORIGINS = "https://devtunnel.tech"

# Shared apex domain for the dt_session / dt_auth cookies so both
# api.devtunnel.tech (this Worker) and devtunnel.tech (the frontend, which
# reads dt_auth from Edge middleware) can see them. Leave unset for local
# development against localhost.
COOKIE_DOMAIN = "devtunnel.tech"

# Public Supabase project URL — not a secret, safe as a var.
SUPABASE_URL = "https://bdxnvouuyfjryuncxkfx.supabase.co"

# Postgres schema this backend owns inside the shared Supabase project (see
# sql/README.md — this keeps auth tables isolated from your wishlist app's
# tables in `public`).
SUPABASE_DB_SCHEMA = "devtunnel"

# GitHub App client id (public, not secret) — DevTunnel.tech, App ID 4767532.
GITHUB_CLIENT_ID = "Iv23liqdlxwKp3dunpZN"

# How long a session stays valid before the user must sign in again.
SESSION_TTL_DAYS = "30"

# Groq model used by the AI Discovery agent (src/lib/groq.ts). Not a
# secret — the key that authenticates against it is (GROQ_API_KEY).
GROQ_MODEL = "openai/gpt-oss-120b"

# ---------------------------------------------------------------------------
# Cron triggers. `src/index.ts`'s `scheduled` handler tells these apart by
# the exact cron expression that fired (`event.cron`) — see that file's own
# doc comment on the `scheduled` export for the full mapping.
#
#   "0 3 * * *"    — once daily at 03:00 UTC: the AI Discovery agent
#                    (src/lib/aiDiscoveryAgent.ts), after most US/EU GitHub
#                    activity has settled. Idempotent per UTC date
#                    (devtunnel.ai_discovery_daily_counters), so an earlier
#                    manual POST /admin/ai/run the same day just tops up
#                    whatever quota is left instead of double-running.
#
#   "*/4 * * * *"  — every 4 minutes: re-warms the contributor-facing
#                    `/issues` GitHub scan cache (src/routes/issues.ts,
#                    src/lib/cacheWarmers.ts `warmContributorIssuesScan`).
#                    Kept comfortably under that cache's 4-minute soft TTL
#                    so a real contributor's page load essentially never
#                    has to wait on a live cross-project GitHub scan itself
#                    — see src/lib/cache.ts's stale-while-revalidate doc
#                    comment for why this matters.
#
#   "*/25 * * * *" — every 25 minutes: re-warms both GitHub-wide catalogs,
#                    `/github-projects` and `/github-open-source-tools`
#                    (src/lib/cacheWarmers.ts `warmGithubCatalogs`), base
#                    catalog plus every named filter. Kept comfortably
#                    under their 30-minute soft TTL for the same reason.
#
# All three are independent, best-effort background jobs — one failing
# never blocks or delays another (see src/lib/cacheWarmers.ts).
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 3 * * *", "*/4 * * * *", "*/25 * * * *"]

# ---------------------------------------------------------------------------
# Per-environment overrides. Deploy with `wrangler deploy --env staging`.
# ---------------------------------------------------------------------------
[env.staging.vars]
ENVIRONMENT = "staging"
GITHUB_CALLBACK_URL = "https://api-staging.devtunnel.tech/auth/callback"
GITHUB_CLI_CALLBACK_URL = "https://api-staging.devtunnel.tech/auth/cli/callback"
FRONTEND_URL = "https://staging.devtunnel.tech"
ALLOWED_ORIGINS = "https://staging.devtunnel.tech"
COOKIE_DOMAIN = "devtunnel.tech"
SUPABASE_URL = "https://bdxnvouuyfjryuncxkfx.supabase.co"
SUPABASE_DB_SCHEMA = "devtunnel"
GITHUB_CLIENT_ID = "Iv23liqdlxwKp3dunpZN" # same GitHub App as production for now; split later if needed
SESSION_TTL_DAYS = "30"
GROQ_MODEL = "openai/gpt-oss-120b"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"

# Cloudflare cron triggers are per-environment — the top-level [triggers]
# above only applies when deploying without --env. Mirrored here so the
# cache warmers (and the AI Discovery agent) also run against staging;
# drop this block if staging shouldn't run scheduled jobs at all.
[env.staging.triggers]
crons = ["0 3 * * *", "*/4 * * * *", "*/25 * * * *"]