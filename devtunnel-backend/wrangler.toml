name = "devtunnel-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Workers Logs + Traces, enabled from the dashboard (Settings > Observability)
# on 2026-09-26 to debug the CPU/subrequest-limit errors on the former */4 * * * *
# issues-scan cron — see src/lib/cacheWarmers.ts. Mirrored here so
# `wrangler deploy` doesn't silently revert the dashboard setting on the
# next deploy.
#
# Sampling lowered from 1 (100%) to keep the Free plan's 200,000
# observability events/day comfortably free of the limit: logs 25%, traces
# 10%. Set head_sampling_rate back to 1 while actively debugging an incident.
# ---------------------------------------------------------------------------
[observability]
[observability.logs]
enabled = true
head_sampling_rate = 0.25
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true

# ---------------------------------------------------------------------------
# KV namespace — LEGACY, READ-ONLY.
#
# This Worker no longer WRITES to Workers KV (Free plan: 1,000 writes/day for
# the whole account, shared with any other project on it). What replaced it:
#   - rate limiting      -> the Rate Limiting bindings below
#   - catalog/issues caches, scan lock -> Supabase + Cache API (src/lib/cache.ts)
#   - `dev login` codes  -> Supabase `cli_auth_codes` (src/lib/cliLoopback.ts)
# The binding stays so first-deploy cache seeding (KV_READ_FALLBACK), the old
# Groq budget-split read (src/lib/groqQuota.ts) and the USE_SUPABASE_CLI_CODES
# rollback keep working. It can be removed once those are no longer wanted.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4e64447403314490b7a19642fd54d2ac"
preview_id = "e51efed129714857aa3ca01040f56314"

# ---------------------------------------------------------------------------
# Cloudflare Rate Limiting bindings (src/lib/rateLimit.ts). Free, no KV writes.
#
# A binding's limit/period are fixed here, so there is one binding per
# per-minute limit the code uses (RL_<limit>, all 60 s periods). The call
# sites keep their `{ bucket, limit, windowSeconds }` arguments and
# rateLimit.ts picks the matching binding.
#
# `namespace_id` must be an integer that is UNIQUE ACROSS YOUR WHOLE
# CLOUDFLARE ACCOUNT. 7004-7120 are used here (staging 7204-7320 below); if
# your wishlist project already uses ids in that range, change these.
#
# Wrangler 3.x (what package-lock.json pins) declares these through
# `unsafe.bindings`. Wrangler 4.36+ would call the same thing `[[ratelimits]]`.
# ---------------------------------------------------------------------------
[[unsafe.bindings]]
name = "RL_4"
type = "ratelimit"
namespace_id = "7004"
simple = { limit = 4, period = 60 }

[[unsafe.bindings]]
name = "RL_5"
type = "ratelimit"
namespace_id = "7005"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_6"
type = "ratelimit"
namespace_id = "7006"
simple = { limit = 6, period = 60 }

[[unsafe.bindings]]
name = "RL_8"
type = "ratelimit"
namespace_id = "7008"
simple = { limit = 8, period = 60 }

[[unsafe.bindings]]
name = "RL_10"
type = "ratelimit"
namespace_id = "7010"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_15"
type = "ratelimit"
namespace_id = "7015"
simple = { limit = 15, period = 60 }

[[unsafe.bindings]]
name = "RL_20"
type = "ratelimit"
namespace_id = "7020"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "RL_30"
type = "ratelimit"
namespace_id = "7030"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
