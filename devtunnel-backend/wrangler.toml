# ---------------------------------------------------------------------------
# Non-secret configuration. Safe to commit — none of these values are
# credentials (Backend_Development_Rules.txt rule 7). Secrets (GitHub client
# secret, Supabase service role key, session signing key) are NEVER put here
# — see README.md "Secrets" section for `wrangler secret put` commands.
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"

# Public URL of this backend once deployed (must match the GitHub OAuth
# App's "Authorization callback URL" exactly, including path).
GITHUB_CALLBACK_URL = "https://api.devtunnel.tech/auth/callback"

# Second callback URL for the SAME GitHub App, used only by the `dev
# login` CLI loopback flow (src/routes/authCli.ts). Must ALSO be added to
# the GitHub App's "Callback URL" list (Settings > Developer settings >
# GitHub Apps > DevTunnel.tech) alongside GITHUB_CALLBACK_URL above — a
# GitHub App supports multiple callback URLs, unlike a classic OAuth App.
GITHUB_CLI_CALLBACK_URL = "https://api.devtunnel.tech/auth/cli/callback"

# Canonical URL of the Next.js frontend (devtunnel-frontend). Used to build
# the post-login/post-error redirect target and as the default CORS origin.
FRONTEND_URL = "https://devtunnel.tech"

# Comma-separated allowlist of origins permitted to call this API with
# credentials (Backend_Development_Rules.txt rules 45–46). No wildcards.
ALLOWED_ORIGINS = "https://devtunnel.tech"

# Shared apex domain for the dt_session / dt_auth cookies so both
# api.devtunnel.tech (this Worker) and devtunnel.tech (the frontend, which
# reads dt_auth from Edge middleware) can see them. Leave unset for local
# development against localhost.
COOKIE_DOMAIN = "devtunnel.tech"

# Public Supabase project URL — not a secret, safe as a var.
SUPABASE_URL = "https://bdxnvouuyfjryuncxkfx.supabase.co"

# Postgres schema this backend owns inside the shared Supabase project (see
# sql/README.md — this keeps auth tables isolated from your wishlist app's
# tables in `public`).
SUPABASE_DB_SCHEMA = "devtunnel"

# GitHub App client id (public, not secret) — DevTunnel.tech, App ID 4767532.
GITHUB_CLIENT_ID = "Ov23ligxea5bIh7uUl8V"

# How long a session stays valid before the user must sign in again.
SESSION_TTL_DAYS = "30"

# ---------------------------------------------------------------------------
# KV-migration feature flags (src/types.ts). Anything except "false" means ON.
# Each one is an instant rollback for its own part — change the value (here
# and redeploy, or in the dashboard under Settings > Variables) without
# touching code:
#   USE_SUPABASE_CACHE      "false" -> cache lives in isolate memory + Cache API only
#   USE_SUPABASE_LOCKS      "false" -> scan lock is per-isolate only
#   USE_SUPABASE_CLI_CODES  "false" -> `dev login` codes go back to KV (1 write/login)
#   USE_RATE_LIMIT_BINDING  "false" -> per-isolate in-memory limiter only
#   KV_READ_FALLBACK        "false" -> don't seed a cold cache from old KV entries
# None of them ever falls back to a KV write on a hot path.
# ---------------------------------------------------------------------------
USE_SUPABASE_CACHE = "true"
USE_SUPABASE_LOCKS = "true"
USE_SUPABASE_CLI_CODES = "true"
USE_RATE_LIMIT_BINDING = "true"
KV_READ_FALLBACK = "true"

# Groq model used by the AI Discovery agent (src/lib/groq.ts). Not a
# secret — the key that authenticates against it is (GROQ_API_KEY).
GROQ_MODEL = "openai/gpt-oss-120b"

# ---------------------------------------------------------------------------
# AI foundation (src/lib/ai/*). All OPTIONAL. Provider API KEYS are secrets
# and never go in this file — set each once per environment with
#   npx wrangler secret put GROQ_API_KEY_2        (OPTIONAL: a Groq key from a DIFFERENT account)
#   npx wrangler secret put CEREBRAS_API_KEY      (cloud.cerebras.ai)
#   npx wrangler secret put GEMINI_API_KEY        (aistudio.google.com/apikey)
#   npx wrangler secret put MISTRAL_API_KEY       (console.mistral.ai)
#   npx wrangler secret put OPENROUTER_API_KEY    (openrouter.ai/keys)
#   npx wrangler secret put GITHUB_MODELS_TOKEN   (github.com/marketplace/models)
# A provider is used only when BOTH its key and its model var below are set.
# Model ids are intentionally left blank: free model lists change often —
# fill each in from that provider's dashboard when you add its key.
# ---------------------------------------------------------------------------
AI_FEATURES_ENABLED = "true"
GROQ_SEARCH_MODEL = "llama-3.1-8b-instant"     # a small fast Groq model (its own per-model budget)
GROQ_SECONDARY_MODEL = "openai/gpt-oss-20b"  # second Groq model, used as a backup for explain/insights
CEREBRAS_MODEL = ""
GEMINI_MODEL = "gemini-3.5-flash-lite"          # e.g. a Flash-Lite model, from aistudio.google.com
MISTRAL_MODEL = ""
OPENROUTER_MODEL = "openai/gpt-oss-20b:free"
GITHUB_MODELS_MODEL = ""
CF_AI_MODEL = "@cf/openai/gpt-oss-20b"           # Workers AI model id (needs the [ai] binding below)

# Cloudflare Workers AI binding — last-resort provider. Uncomment to enable;
# it needs no secret. (Add the same block under [env.staging] if you want it there.)
# [ai]
# binding = "AI"

# ---------------------------------------------------------------------------
# Cron triggers. `src/index.ts`'s `scheduled` handler tells these apart by
# the exact cron expression that fired (`event.cron`) — see that file's own
# doc comment on the `scheduled` export for the full mapping.
#
#   "0 3 * * *"    — once daily at 03:00 UTC: the AI Discovery agent
#                    (src/lib/aiDiscoveryAgent.ts), after most US/EU GitHub
#                    activity has settled. Idempotent per UTC date
#                    (devtunnel.ai_discovery_daily_counters), so an earlier
#                    manual POST /admin/ai/run the same day just tops up
#                    whatever quota is left instead of double-running.
#
#   "*/15 * * * *" — every 15 minutes: re-warms the contributor-facing
#                    `/issues` GitHub scan cache (src/routes/issues.ts,
#                    src/lib/cacheWarmers.ts `warmContributorIssuesScan`).
#                    Kept under that cache's 20-minute soft TTL so a real
#                    contributor's page load essentially never has to wait
#                    on a live cross-project GitHub scan itself. (Was every
#                    4 minutes; slowed to stay inside Workers KV's Free-plan
#                    1,000 writes/day.)
#
#   "*/25 * * * *" — every 25 minutes: re-warms both GitHub-wide catalogs,
#                    `/github-projects` and `/github-open-source-tools`
#                    (src/lib/cacheWarmers.ts `warmGithubCatalogs`), base
#                    catalog plus every named filter. Kept comfortably
#                    under their 30-minute soft TTL for the same reason.
#
#   "12 * * * *"   — hourly: re-warms ONE `/github-projects` star-range
#                    bucket per run (src/lib/githubCatalog.ts
#                    `warmRotatingCatalogFilter`); all 8 buckets cycle every
#                    8 hours.
#
#   "40 * * * *"   — hourly: syncs submitted PRs with GitHub (src/lib/prSync.ts):
#                    DevTunnel task PRs and `dev submit` PRs on any repo. Its own
#                    cron on purpose — sharing "*/15" with the issues warmer
#                    exhausted the per-invocation subrequest limit and left the
#                    caches cold. NOTE: Workers Free allows 5 cron triggers per
#                    account in total; this is the 5th for production.
#
# All five are independent, best-effort background jobs — one failing
# never blocks or delays another (see src/lib/cacheWarmers.ts).
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 3 * * *", "*/15 * * * *", "*/25 * * * *", "12 * * * *", "40 * * * *"]

